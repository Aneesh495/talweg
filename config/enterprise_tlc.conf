# Talweg Flash Geometry Configuration: Enterprise TLC NAND Profile
# Models high-density 3D Triple-Level Cell solid-state media

[geometry]
channels = 8
dies_per_channel = 4
planes_per_die = 4
blocks_per_plane = 1024
pages_per_block = 128
page_size = 4096
oob_size = 256

[timings]
read_latency_us = 45
prog_latency_us = 650
erase_latency_us = 3500

[endurance]
max_pe_cycles = 1500
wear_delta_threshold = 48
bad_block_reserve_pct = 7

[subsystems]
gc_policy = cost_benefit
gc_free_threshold_pct = 12
cache_capacity_pages = 2048
journal_capacity_blocks = 32
sync_mode = wal_flush

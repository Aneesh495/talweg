# Talweg Flash Geometry Configuration: Default Simulation Profile
# Optimized for rapid in-memory testing and deterministic unit drills

[geometry]
channels = 4
dies_per_channel = 2
planes_per_die = 2
blocks_per_plane = 256
pages_per_block = 64
page_size = 4096
oob_size = 128

[timings]
read_latency_us = 25
prog_latency_us = 220
erase_latency_us = 2000

[endurance]
max_pe_cycles = 3000
wear_delta_threshold = 32
bad_block_reserve_pct = 5

[subsystems]
gc_policy = cost_benefit
gc_free_threshold_pct = 15
cache_capacity_pages = 256
journal_capacity_blocks = 8
sync_mode = wal_flush

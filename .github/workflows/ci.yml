name: Talweg Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify-macos:
    name: Build & Verify (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ATS2 Postiats & Dependencies
        run: |
          brew update
          brew install ats2-postiats

      - name: Check Typography Invariants
        run: |
          python3 tools/lint_no_em_dash.py

      - name: Build Core Engine & Tool Suite
        run: |
          make clean
          make all

      - name: Run Full Test Suite
        run: |
          make test

      - name: Run Benchmark Evaluation
        run: |
          python3 benchmarks/bench_waf_analysis.py --workload benchmarks/workloads/sequential_stream.json
          python3 benchmarks/bench_latency_percentiles.py --ops 500

  build-and-verify-linux:
    name: Build & Verify (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libgmp-dev python3 git ats2-lang
          echo "PATSHOME=/usr/lib/ats2-postiats-0.4.2" >> $GITHUB_ENV

      - name: Check Typography Invariants
        run: |
          python3 tools/lint_no_em_dash.py

      - name: Build Core Engine & Tool Suite
        run: |
          make clean
          make all

      - name: Run Full Test Suite
        run: |
          make test

      - name: Run Benchmark Evaluation
        run: |
          python3 benchmarks/bench_waf_analysis.py --workload benchmarks/workloads/sequential_stream.json
          python3 benchmarks/bench_latency_percentiles.py --ops 500
